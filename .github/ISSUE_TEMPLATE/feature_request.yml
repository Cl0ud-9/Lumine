name: Idea or feature request
description: Suggest something Lumine could do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Please open one before writing code for a large change, so the approach can be agreed first
        (see [CONTRIBUTING](https://github.com/Cl0ud-9/Lumine/blob/main/CONTRIBUTING.md)).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the wish, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Lumine to do?
      description: A sketch or a screenshot of what you have in mind helps a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Have you tried anything else?
      description: A workaround, another tool, or a different way it could work.
  - type: dropdown
    id: area
    attributes:
      label: Which part is it about?
      options:
        - The proposal or celebration page
        - The dashboard and its stats
        - Accounts and login
        - Setting up or deploying
        - Something else

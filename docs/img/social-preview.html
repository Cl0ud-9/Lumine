<!doctype html>
<!--
  Source for docs/img/social-preview.jpg (the repository's GitHub "social preview" image, 1280x640).
  Re-render it with a headless browser at a 1280x640 viewport and save as JPEG:

    npx playwright screenshot --viewport-size=1280,640 docs/img/social-preview.html docs/img/social-preview.png

  then convert to JPEG. Then upload it under GitHub -> Settings -> General -> Social preview
  (GitHub has no API for that, so the upload is a manual step).

  Uses the app's own fonts from /public/fonts. Deliberately shows no app screenshots - just the brand.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumine social preview</title>
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 400 700; src: url('../../public/fonts/fredoka-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Pacifico'; font-weight: 400; src: url('../../public/fonts/pacifico-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Quicksand'; font-weight: 500 700; src: url('../../public/fonts/quicksand-latin.woff2') format('woff2'); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }

  body {
    position: relative;
    font-family: 'Quicksand', sans-serif;
    background-color: #ffeef2;
    /* the same four-corner mesh the app uses (.bg-gradient-mesh) */
    background-image:
      radial-gradient(at 0% 0%, hsla(343, 100%, 88%, 1) 0px, transparent 50%),
      radial-gradient(at 100% 0%, hsla(320, 100%, 85%, 1) 0px, transparent 50%),
      radial-gradient(at 100% 100%, hsla(280, 100%, 90%, 1) 0px, transparent 50%),
      radial-gradient(at 0% 100%, hsla(350, 100%, 80%, 1) 0px, transparent 50%);
  }

  /* soft white dot grid, as on the proposal page */
  .dots { position: absolute; inset: 0; background-image: radial-gradient(circle, #fff 1.5px, transparent 1.5px); background-size: 44px 44px; opacity: .35; }

  .orb { position: absolute; border-radius: 50%; filter: blur(70px); }
  .orb.a { width: 460px; height: 460px; left: -120px; top: -140px; background: #f9a8d4; opacity: .55; }
  .orb.b { width: 520px; height: 520px; right: -140px; bottom: -200px; background: #d8b4fe; opacity: .55; }

  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .brand { display: flex; align-items: center; gap: 34px; }

  .heart-orb {
    width: 168px; height: 168px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 30%, #ff8da6, #ff3e6d);
    box-shadow: 0 22px 40px rgba(255, 62, 109, .38), inset -8px -10px 22px rgba(0, 0, 0, .08), inset 8px 8px 22px rgba(255, 255, 255, .45);
    position: relative;
  }
  .heart-orb::after { content: ''; position: absolute; top: 15%; left: 20%; width: 30%; height: 20%; background: rgba(255, 255, 255, .6); border-radius: 50%; transform: rotate(-15deg); }
  .heart-orb svg { width: 92px; height: 92px; fill: #fff; filter: drop-shadow(0 3px 5px rgba(160, 20, 70, .25)); }

  .wordmark { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 212px; line-height: 1; letter-spacing: -3px; color: #ff4d7d; text-shadow: 0 10px 0 rgba(255, 255, 255, .55), 0 22px 36px rgba(255, 77, 125, .28); }

  .tagline { margin-top: 26px; font-family: 'Pacifico', cursive; font-size: 58px; color: rgba(236, 72, 153, .86); transform: rotate(-1.2deg); }

  .sub { margin-top: 26px; font-weight: 700; font-size: 25px; letter-spacing: .04em; color: #9d2f5f; opacity: .85; }
  .sub b { font-weight: 700; color: #be185d; }

  .float { position: absolute; fill: currentColor; }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="dots"></div>

  <!-- floating hearts and sparkles (decorative) -->
  <svg class="float" style="left:70px;top:420px;width:78px;height:78px;color:#ec4899;opacity:.35;transform:rotate(-14deg)" viewBox="0 0 24 24"><path id="h" d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.245 15.245 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/></svg>
  <svg class="float" style="left:150px;top:96px;width:44px;height:44px;color:#ec4899;opacity:.30;transform:rotate(10deg)" viewBox="0 0 24 24"><use href="#h"/></svg>
  <svg class="float" style="right:96px;top:70px;width:92px;height:92px;color:#ec4899;opacity:.28;transform:rotate(16deg)" viewBox="0 0 24 24"><use href="#h"/></svg>
  <svg class="float" style="right:170px;bottom:92px;width:56px;height:56px;color:#ec4899;opacity:.38;transform:rotate(-8deg)" viewBox="0 0 24 24"><use href="#h"/></svg>
  <svg class="float" style="left:330px;bottom:48px;width:34px;height:34px;color:#ec4899;opacity:.32" viewBox="0 0 24 24"><use href="#h"/></svg>

  <svg class="float" style="left:96px;top:250px;width:60px;height:60px;color:#c084fc;opacity:.75" viewBox="0 0 24 24"><path d="M12 2L14.39 9.61L22 12L14.39 14.39L12 22L9.61 14.39L2 12L9.61 9.61L12 2Z"/></svg>
  <svg class="float" style="right:86px;top:300px;width:46px;height:46px;color:#d8b4fe;opacity:.95" viewBox="0 0 24 24"><path d="M12 2L14.39 9.61L22 12L14.39 14.39L12 22L9.61 14.39L2 12L9.61 9.61L12 2Z"/></svg>
  <svg class="float" style="right:250px;top:128px;width:30px;height:30px;color:#fde047;opacity:.95" viewBox="0 0 24 24"><path d="M12 2L14.39 9.61L22 12L14.39 14.39L12 22L9.61 14.39L2 12L9.61 9.61L12 2Z"/></svg>
  <svg class="float" style="left:196px;bottom:214px;width:36px;height:36px;color:#fde047;opacity:.9" viewBox="0 0 24 24"><path d="M12 2L14.39 9.61L22 12L14.39 14.39L12 22L9.61 14.39L2 12L9.61 9.61L12 2Z"/></svg>
  <svg class="float" style="right:64px;bottom:210px;width:34px;height:34px;color:#f9a8d4;opacity:.95" viewBox="0 0 24 24"><path d="M12 2L14.39 9.61L22 12L14.39 14.39L12 22L9.61 14.39L2 12L9.61 9.61L12 2Z"/></svg>

  <div class="stage">
    <div class="brand">
      <div class="heart-orb"><svg viewBox="0 0 24 24"><use href="#h"/></svg></div>
      <div class="wordmark">Lumine</div>
    </div>
    <div class="tagline">Will you be my Valentine?</div>
    <div class="sub">A link they will never forget &nbsp;·&nbsp; <b>github.com/Cl0ud-9/Lumine</b></div>
  </div>
</body>
</html>

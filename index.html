<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumine</title>
  <meta name="description" content="Lumine - create a playful, interactive Valentine proposal link and watch the moment they say yes." />
  <meta name="theme-color" content="#ffeef2" />

  <!-- Fonts are self-hosted (see the @font-face rules at the top of src/index.css), so there is
       no third-party connection to open and no render-blocking Google Fonts stylesheet.
       Preload only the files used on first paint of every page - the icon font (6KB subset)
       and the two UI fonts - so they download in parallel with the JS/CSS instead of being
       discovered late. `crossorigin` is required for font preloads even when same-origin,
       otherwise the browser fetches the file twice. Inter / Pacifico / Plus Jakarta Sans are
       only needed on some routes and load on demand. -->
  <link rel="preload" href="/fonts/material-symbols-eada4cf0.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/quicksand-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Paint the brand colour immediately so there is no white flash before the stylesheet lands. -->
  <style>
    html { background: #ffeef2; }
  </style>
</head>

<body>
  <div id="root"></div>
  <noscript>Lumine needs JavaScript enabled to run.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
